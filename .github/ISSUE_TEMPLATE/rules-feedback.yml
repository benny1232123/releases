name: Testnet rules feedback
description: Ask about or comment on the testnet rewards rules (final, version 2.1).
title: "Rules feedback: "
labels: ["rules-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reading the [testnet rules](https://transitfabric.xyz/testnet-rules.html). They are final (version 2.1, effective 2026-11-17); any later change follows the rules' Changes section. Use this form for a question, a case the rules don't cover, or a suggestion for a future version.

        Keep it to one topic per Issue if you can. Never paste private keys, seed phrases or IP addresses. Security problems with the rules (a way to earn points you shouldn't) go through a [private advisory](https://github.com/transitfabric/releases/security/advisories/new), not here.
  - type: dropdown
    id: section
    attributes:
      label: Which section?
      options:
        - The pool
        - What an allocation is
        - Who can earn
        - "Node points: base"
        - "Node points: diversity"
        - "Node points: environment"
        - "Node points: roles"
        - "Node points: fleet"
        - Duplication
        - How points become alpha
        - Solvers, findings, docs
        - Fairness rules
        - Ledger and appeals
        - Payout schedule
        - Changes
        - Something else
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: What would you change, and why? If it's about a number, say what value you'd pick.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup (optional)
      description: What you run or plan to run (for example a VM, an OpenWrt router or a home node behind NAT). It helps us weigh the feedback.
